name: Publish Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve published journal baseline
        shell: bash
        env:
          JOURNAL_URL: https://bottomry.github.io/cb-follow-through/data/journal.json
        run: |
          status="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --header 'Cache-Control: no-cache' --output "$RUNNER_TEMP/published-journal.json" \
            --write-out '%{http_code}' "$JOURNAL_URL?source=$GITHUB_SHA")"
          if [ "$status" = 200 ]; then
            echo "JOURNAL_PUBLISHED_BASE=$RUNNER_TEMP/published-journal.json" >> "$GITHUB_ENV"
          elif [ "$status" = 404 ]; then
            echo 'JOURNAL_INITIAL_PUBLISH=1' >> "$GITHUB_ENV"
          else
            echo "Published journal request returned HTTP $status" >&2
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
